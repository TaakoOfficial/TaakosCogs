site_name: Taako's Cogs Documentation
site_url: https://taakoofficial.github.io/TaakosCogs/latest/
site_author: Taako
site_description: Installation, configuration, and reference documentation for Taako's Red-DiscordBot cogs.

repo_name: TaakoOfficial/TaakosCogs
repo_url: https://github.com/TaakoOfficial/TaakosCogs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site/latest

plugins:
  - search
  - gen-files:
      scripts:
        - .github/scripts/generate_docs.py
  - literate-nav:
      nav_file: SUMMARY.md

theme:
  name: material
  favicon: assets/brand/taakos-cogs-mark.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  logo: assets/brand/taakos-cogs-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TaakoOfficial/TaakosCogs
      name: Taako's Cogs on GitHub

copyright: Copyright &copy; 2026 Taako. Distributed under the GNU AGPLv3 unless an individual cog states otherwise.
