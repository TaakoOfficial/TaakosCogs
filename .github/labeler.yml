changed-files-labels-limit: 12
max-files-changed: 500

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
          - "mkdocs.yml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - ".pre-commit-config.yaml"
          - "pyproject.toml"
          - "uv.lock"

tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**"

CI:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/scripts/**"
          - ".github/workflows/**"

new-cog:
  - head-branch:
      - "^feat(ure)?[/_-].*cog"
      - "^cog[/_-]"

