name: Live Cog Load

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cog-load
  cancel-in-progress: true

jobs:
  changes:
    name: Select changed cogs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cogs: ${{ steps.select.outputs.cogs }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select affected cogs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 .github/scripts/changed_cogs.py --all --github-output "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 .github/scripts/changed_cogs.py \
              --base "$PR_BASE" \
              --head "$PR_HEAD" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/changed_cogs.py \
              --base "$PUSH_BASE" \
              --head "$CURRENT_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

  downloader:
    name: Install, load, and unload changed cogs
    needs: changes
    if: >-
      needs.changes.outputs.count != '0' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Download pinned Downloader test helper
        shell: bash
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/test_downloader_cogs.py"
          curl --fail --location --silent --show-error \
            "https://c.csw.im/actions/red-discordbot/raw/commit/29eff736736e8ddd9ab424b3a2724fd2af6a9a62/actions/test-red-discordbot-downloader/test_downloader_cogs.py" \
            --output "$helper"
          echo "61388510472da5fb5d4b2d96b6bcda780b0fd382fd048a1cf2b061f9076bc582  $helper" | sha256sum --check --strict

      - name: Test every cog through Red Downloader
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          COG_PATHS: ${{ needs.changes.outputs.cogs }}
          RPC_PORT: "6133"
          RED_INSTANCE_NAME: temporary_red
          REPO_NAME: taakoscogs_ci
          REPO_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_BOT_TOKEN" ]]; then
            echo "DISCORD_BOT_TOKEN is not configured."
            exit 1
          fi

          echo "Testing changed cogs: $COG_PATHS"

          bot_log="$RUNNER_TEMP/redbot.log"
          uv run --locked python -m redbot \
            --no-instance \
            --token "$DISCORD_BOT_TOKEN" \
            --prefix "!" \
            --rpc \
            --rpc-port "$RPC_PORT" \
            >"$bot_log" 2>&1 &
          bot_pid=$!

          cleanup() {
            kill "$bot_pid" 2>/dev/null || true
            wait "$bot_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in {1..30}; do
            if ! kill -0 "$bot_pid" 2>/dev/null; then
              echo "Red exited before its RPC endpoint became ready."
              tail -n 200 "$bot_log"
              exit 1
            fi
            if curl --silent --output /dev/null "http://127.0.0.1:$RPC_PORT/"; then
              break
            fi
            sleep 1
          done

          if ! kill -0 "$bot_pid" 2>/dev/null; then
            tail -n 200 "$bot_log"
            exit 1
          fi

          if ! uv run --locked python "$RUNNER_TEMP/test_downloader_cogs.py"; then
            tail -n 200 "$bot_log"
            exit 1
          fi
