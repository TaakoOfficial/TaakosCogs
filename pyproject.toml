[project]
name = "taakoscogs-dev"
version = "0.1.0"
description = "Locked development and CI environment for Taako's Cogs."
requires-python = ">=3.11,<3.12"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "Red-DiscordBot>=3.5.0,<3.6",
    "aiohttp>=3.8.0",
    "chat-exporter>=3.1.0",
    "graphviz>=0.20.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "pip>=26.2,<27",
    "pytz",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    "pytest>=8.0,<10",
    "ruff==0.16.1",
]
docs = [
    "mkdocs-gen-files>=0.6,<1",
    "mkdocs-literate-nav>=0.6,<1",
    "mkdocs-material>=9.7,<10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 130

[tool.ruff.lint]
extend-select = [
    "F", "W", "E", "I", "UP", "C4", "FA", "ISC", "ICN",
    "RET", "SIM", "TID", "TC", "PTH", "NPY", "A", "BLE",
    "COM818", "DTZ", "N", "ASYNC"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
